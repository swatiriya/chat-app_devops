<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NexChat — Real-Time Messaging</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/auth.css"/>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="bg-blob blob3"></div>

  <div class="auth-container">
    <div class="brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M4 8C4 5.8 5.8 4 8 4h12c2.2 0 4 1.8 4 4v10c0 2.2-1.8 4-4 4H9l-5 4V8z" fill="#fff"/>
          <circle cx="10" cy="13" r="1.5" fill="#0f172a"/>
          <circle cx="14" cy="13" r="1.5" fill="#0f172a"/>
          <circle cx="18" cy="13" r="1.5" fill="#0f172a"/>
        </svg>
      </div>
      <span class="brand-name">NexChat</span>
    </div>

    <div class="card">
      <div class="tab-bar">
        <button class="tab active" data-tab="login">Sign In</button>
        <button class="tab" data-tab="register">Create Account</button>
        <div class="tab-indicator"></div>
      </div>

      <!-- LOGIN FORM -->
      <form class="form-panel active" id="login-panel">
        <div class="form-header">
          <h1>Welcome back</h1>
          <p>Sign in to your NexChat account</p>
        </div>
        <div class="alert" id="login-alert"></div>
        <div class="field">
          <label for="login-email">Email address</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
            <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"/>
          </div>
        </div>
        <div class="field">
          <label for="login-password">
            Password
            <a href="#" class="forgot">Forgot password?</a>
          </label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
            <button type="button" class="toggle-pw" onclick="togglePw('login-password', this)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="login-btn">
          <span>Sign In</span>
          <div class="spinner hidden"></div>
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form class="form-panel" id="register-panel">
        <div class="form-header">
          <h1>Join NexChat</h1>
          <p>Create your free account today</p>
        </div>
        <div class="alert" id="register-alert"></div>
        <div class="name-row">
          <div class="field">
            <label for="reg-firstname">First name</label>
            <input type="text" id="reg-firstname" placeholder="Alex"/>
          </div>
          <div class="field">
            <label for="reg-lastname">Last name</label>
            <input type="text" id="reg-lastname" placeholder="Johnson"/>
          </div>
        </div>
        <div class="field">
          <label for="reg-username">Username</label>
          <div class="input-wrap">
            <span class="input-prefix">@</span>
            <input type="text" id="reg-username" placeholder="alexj" class="has-prefix"/>
          </div>
        </div>
        <div class="field">
          <label for="reg-email">Email address</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
            <input type="email" id="reg-email" placeholder="you@example.com"/>
          </div>
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="reg-password" placeholder="Min. 8 characters" oninput="checkStrength(this.value)"/>
            <button type="button" class="toggle-pw" onclick="togglePw('reg-password', this)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
          <span class="strength-label" id="strength-label"></span>
        </div>
        <div class="field">
          <label for="reg-confirm">Confirm password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
            <input type="password" id="reg-confirm" placeholder="Re-enter password"/>
          </div>
        </div>
        <label class="checkbox-field">
          <input type="checkbox" id="terms-check"/>
          <span class="checkmark"></span>
          <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
        </label>
        <button type="submit" class="btn-primary" id="register-btn">
          <span>Create Account</span>
          <div class="spinner hidden"></div>
        </button>
      </form>
    </div>

    <p class="footer-note">Secure • Encrypted • Private</p>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
