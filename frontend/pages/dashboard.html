<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexChat</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<script src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js" type="module"></script>
<body>

<div class="app-container">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="top-bar">
            <div class="profile-section">
                <div class="avatar online" id="my-avatar">ME</div>

                <div>
                    <h3 id="my-name">Loading...</h3>
                    <span>Online</span>
                </div>
            </div>

            <div class="top-actions">
                <button id="theme-toggle">🌙</button>
                <button onclick="logout()">🚪</button>
            </div>
        </div>

        <div class="search-container">
            <input
                type="text"
                placeholder="Search users, groups..."
                id="search-input"
            >
        </div>

        <!-- Dashboard Cards -->
        <div class="stats-grid">

            <div class="stat-card">
                <h4 id="totalChats">0</h4>
                <p>Chats</p>
            </div>

            <div class="stat-card">
                <h4 id="onlineUsers">0</h4>
                <p>Online</p>
            </div>

            <div class="stat-card">
                <h4 id="groupCount">0</h4>
                <p>Groups</p>
            </div>

        </div>

        <!-- USERS -->
        <div class="section">

            <div class="section-header">
                <span>Direct Messages</span>
                <button id="new-chat-btn">+</button>
            </div>

            <div
                id="contacts-list"
                class="contacts-list">
            </div>

        </div>

        <!-- GROUPS -->
        <div class="section">

            <div class="section-header">
                <span>Groups</span>

                <div>
                    <button id="create-group-btn">
                        +
                    </button>
                </div>

            </div>
            

            <div id="group-list">

            </div>

        </div>

    </aside>

    <!-- CHAT SECTION -->
    <main class="chat-container">

        <header class="chat-header">

            <button
                class="mobile-menu"
                id="menu-toggle">
                ☰
            </button>

            <div class="chat-user">

                <div
                    class="avatar"
                    id="peer-avatar">
                    ?
                </div>

                <div>

                    <h3 id="peer-name">
                        Select Chat
                    </h3>

                    <span id="online-status">
                        Offline
                    </span>

                    <span
                        id="typing-text"
                        class="typing-indicator hidden">
                        typing...
                    </span>

                </div>

            </div>

            <div class="chat-actions">

    <button title="Voice Call">
        📞
    </button>

    <button title="Video Call">
        🎥
    </button>

    <button
        id="add-member-btn"
        title="Add Member">
        👥+
    </button>

    <button
        id="delete-group-btn"
        title="Delete Group">
        🗑️
    </button>

</div>

        </header>

        <!-- MESSAGES -->
        <section
            id="messages-area"
            class="messages-area">

            <div id="empty-state">

                <div class="welcome-box">

                    <h2>
                        Welcome to NexChat
                    </h2>

                    <p>
                        Start a conversation or create a group.
                    </p>

                </div>

            </div>

        </section>

        <!-- INPUT -->
       <footer class="chat-footer">

    <input
        type="file"
        id="file-input"
        hidden
    >

    <button
        id="upload-btn"
        title="Upload File">
        📎
    </button>

    <button
        id="emoji-btn"
        title="Emoji">
        😀
    </button>

    <textarea
        id="message-input"
        placeholder="Type a message..."
        rows="1">
    </textarea>

    <button
        id="send-btn"
        onclick="sendMessage()">
        ➤
    </button>

</footer>
<emoji-picker
    id="emoji-picker"
    class="hidden"
    style="
        position: fixed;
        bottom: 90px;
        right: 30px;
        z-index: 9999;
    ">
</emoji-picker>

    </main>

</div>

<!-- Create Group Modal -->
<div
    class="modal hidden"
    id="group-modal">

    <div class="modal-content">

        <h2>Create Group</h2>

        <input
            type="text"
            id="group-name"
            placeholder="Group Name">

        <input
            type="text"
            id="group-avatar"
            placeholder="Avatar URL">

        <button id="save-group">
            Create Group
        </button>

    </div>

</div>

<script src="../js/dashboard.js"></script>
<script src="" id="socket-loader"></script>

<script>
document.getElementById("socket-loader").src =
  `${window.location.protocol}//${window.location.hostname}:5001/socket.io/socket.io.js`;
</script><script src="../js/socket.js"></script>

</body>
</html>
